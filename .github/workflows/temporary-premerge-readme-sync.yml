name: Temporary premerge README sync

on:
  push:
    branches:
      - feat/dry-run-foundations

permissions:
  contents: write

jobs:
  sync-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dry-run-foundations
          fetch-depth: 0

      - name: Synchronize README with audited architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          old_status = "This fork is currently refactoring the extension on `feat/dry-run-foundations` with an emphasis on read-only diagnostics, safer interception, course-scoped caching, modular parsing, Monaco read inspection, fixtures, and regression tests. See `docs/ARCHITECTURE.md` and PR #1 for the current migration status."
          new_status = "The planned read-only/security refactor on `feat/dry-run-foundations` is complete and has undergone a dedicated pre-merge audit. The branch now includes modular read-only diagnostics, minimized interception, SPA-safe course state, read-only Monaco inspection, sanitized fixtures, repository-hygiene gates, and real Chrome headless regression tests. See `docs/ARCHITECTURE.md`, `docs/CHANGELOG_REFACTOR.md`, and PR #1 for the audited boundary and validation status."
          if text.count(old_status) != 1:
              raise SystemExit('Expected fork status paragraph exactly once.')
          text = text.replace(old_status, new_status, 1)

          start = text.index('### What changed\n', text.index('## 🔐 Coursera Request Interception'))
          end = text.index('### Activating interceptor updates\n', start)
          audited = '''### What changed

The interceptor still observes Coursera's own Fetch and XMLHttpRequest traffic without replacing the original browser methods, but the data crossing from the page's MAIN world into the extension world is deliberately minimized:

* **Coursera API only:** non-Coursera traffic and non-`/api/` URLs are ignored.
* **Query minimization:** forwarded URLs keep only the `slug` and `userId` query parameters used by existing integration; unrelated query data is discarded.
* **No request bodies:** Fetch/XHR request bodies are never forwarded through the interceptor bridge.
* **Header-name diagnostics:** observed allowlisted CSRF/request headers are exposed as names only for diagnostics.
* **Single retained header value:** only `x-csrf3-token` may cross with its value because the existing media-completion path still requires it. Authorization, Cookie, CSRF2, framework-CSRF, and `x-requested-with` values are not forwarded.
* **Response minimization:** dispatcher data is reduced to the learner identifier when needed by legacy integration, while course-material responses are reduced to the module/lesson/item/passable fields consumed by the read-only requirement normalizer.
* **Same-origin messaging:** page/content message bridges validate the current Coursera origin and use an exact `postMessage` target origin.

The original browser networking methods are still called, so interception observes the request without preventing or replacing Coursera's normal network operation.

### Captured request context

The legacy content integration retains the current `x-csrf3-token` value only in the Coursera tab's content-script memory because the existing media-completion request depends on it. Other observed allowlisted request headers are represented by their names, not their values, in the modular diagnostic state.

The retained CSRF3 value is not written to `chrome.storage`, committed to the repository, or included in Dry Run reports. Reloading or closing the Coursera tab clears the in-memory content-script state.

### Request flow

```text
Coursera creates a Fetch or XHR API request
        ↓
intercept.js observes the request in MAIN world
        ↓
URL/query data, header exposure, and response fields are minimized
        ↓
No request body crosses the bridge; only the legacy-required CSRF3 value may cross
        ↓
content.js keeps legacy mutation context while CourseraReadRuntime keeps sanitized read-only state
```

The media-completion path continues to use the existing `x-csrf3-token` behavior. The pre-merge refactor intentionally does not expand or redesign mutation/completion behavior.

'''
          text = text[:start] + audited + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate README audit claims
        shell: bash
        run: |
          grep -q 'dedicated pre-merge audit' README.md
          grep -q 'No request bodies' README.md
          grep -q 'only `x-csrf3-token` may cross with its value' README.md
          if grep -q 'retains only the following allowlisted values' README.md; then exit 1; fi
          if grep -q 'headers, body, and response' README.md; then exit 1; fi

      - name: Commit README synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README with premerge security audit"
          git push origin HEAD:feat/dry-run-foundations
