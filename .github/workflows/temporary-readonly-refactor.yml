name: One-shot read-only legacy cleanup

on:
  push:
    branches:
      - feat/dry-run-foundations

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dry-run-foundations
          fetch-depth: 0

      - name: Replace duplicated read-only helpers with runtime delegates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("content.js")
          text = path.read_text(encoding="utf-8")

          def replace_between(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement.rstrip() + "\n\n" + source[end:]

          read_runtime_wrappers = r'''function readRuntime() {
              const runtime = globalThis.CourseraReadRuntime;
              if (!runtime) {
                  throw new Error("Coursera read runtime is unavailable. Reload the page and try again.");
              }
              return runtime;
          }

          function getCurrentCourseSlug() {
              return readRuntime().getCurrentCourseSlug();
          }

          async function loadCourseMaterials() {
              return readRuntime().loadCourseMaterials();
          }

          function normalizeCourseRequirements(materials, courseSlug) {
              return readRuntime().normalizeCourseRequirements(materials, courseSlug);
          }'''

          selector_wrappers = r'''function assessmentQuestionBlocks() {
              return readRuntime().assessmentQuestionBlocks();
          }

          function codeEditorDescriptor(block) {
              return readRuntime().codeEditorDescriptor(block);
          }'''

          scrape_wrapper = r'''async function scrapeAssessmentDetailed() {
              return readRuntime().scrapeAssessmentDetailed();
          }'''

          text = replace_between(
              text,
              "function getCurrentCourseSlug() {",
              "async function getCourseRequirements() {",
              read_runtime_wrappers,
          )
          text = replace_between(
              text,
              "function assessmentQuestionBlocks() {",
              "function requestMonacoBridge(action, payload = {}) {",
              selector_wrappers,
          )
          text = replace_between(
              text,
              "async function scrapeAssessmentDetailed() {",
              "function requestAIAssessmentAnswers(questions) {",
              scrape_wrapper,
          )

          forbidden_legacy_markers = [
              "function linkedCourseCollection(",
              "function requirementRoute(",
              "function courseItemType(",
              "function courseItemIsLocked(",
              "function itemIdFromPassable(",
              "apiUrl.searchParams.set(\"showLockedItems\"",
              "const semanticBlocks = Array.from(document.querySelectorAll",
              "const nextCodeBindings = new Map();\n    const questionBlocks = assessmentQuestionBlocks();",
          ]
          leftovers = [marker for marker in forbidden_legacy_markers if marker in text]
          if leftovers:
              raise SystemExit(f"Legacy read-only markers remain: {leftovers}")

          required_wrappers = [
              "function readRuntime()",
              "return readRuntime().getCurrentCourseSlug();",
              "return readRuntime().loadCourseMaterials();",
              "return readRuntime().normalizeCourseRequirements(materials, courseSlug);",
              "return readRuntime().assessmentQuestionBlocks();",
              "return readRuntime().codeEditorDescriptor(block);",
              "return readRuntime().scrapeAssessmentDetailed();",
          ]
          missing = [marker for marker in required_wrappers if marker not in text]
          if missing:
              raise SystemExit(f"Read-runtime wrappers missing: {missing}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Check JavaScript syntax
        run: |
          for file in \
            ai-providers.js \
            background.js \
            content.js \
            course-requirements.js \
            assessment-parser.js \
            coursera-api.js \
            coursera-state.js \
            monaco-bridge.js \
            content-adapters.js \
            diagnostics.js \
            dry-run.js \
            intercept-policy.js \
            intercept.js \
            popup.js; do
            node --check "$file"
          done

      - name: Run unit and contract tests
        run: node --test tests/*.test.js

      - name: Run read-only browser smoke test
        run: bash tests/browser/run-smoke.sh

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- content.js; then
            echo "No legacy read-only cleanup was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js
          git commit -m "refactor: remove duplicated read-only helpers from content"
          git push origin HEAD:feat/dry-run-foundations
