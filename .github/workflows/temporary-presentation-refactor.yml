name: One-shot presentation cleanup

on:
  push:
    branches:
      - feat/dry-run-foundations

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dry-run-foundations
          fetch-depth: 0

      - name: Replace legacy banner helpers with presentation delegates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("content.js")
          text = path.read_text(encoding="utf-8")
          start_marker = "// Helper UI Functions for the Banner"
          end_marker = "async function startCompletionLoop() {"

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''// Presentation helpers are isolated in presentation.js.
          function presentationRuntime() {
              const presenter = globalThis.CourseraPresentation;
              if (!presenter || typeof presenter.show !== "function" || typeof presenter.hide !== "function") {
                  throw new Error("Coursera presentation runtime is unavailable. Reload the page and try again.");
              }
              return presenter;
          }

          function showOrUpdateBanner(text, type = "info") {
              presentationRuntime().show(text, type);
          }

          function hideBanner() {
              presentationRuntime().hide();
          }'''

          updated = text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          forbidden = [
              'banner.style.position = "fixed"',
              'banner.style.backgroundColor = "#16a34a"',
              'banner.innerHTML =',
              'style.innerHTML = `@keyframes spin',
          ]
          leftovers = [marker for marker in forbidden if marker in updated]
          if leftovers:
              raise SystemExit(f"Legacy presentation markers remain: {leftovers}")

          required = [
              "function presentationRuntime()",
              "globalThis.CourseraPresentation",
              "presentationRuntime().show(text, type);",
              "presentationRuntime().hide();",
              "async function startCompletionLoop() {",
          ]
          missing = [marker for marker in required if marker not in updated]
          if missing:
              raise SystemExit(f"Presentation delegates missing: {missing}")

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Check JavaScript syntax
        run: |
          for file in \
            ai-providers.js \
            background.js \
            content.js \
            course-requirements.js \
            assessment-parser.js \
            coursera-api.js \
            coursera-state.js \
            monaco-bridge.js \
            presentation.js \
            content-adapters.js \
            diagnostics.js \
            dry-run.js \
            intercept-policy.js \
            intercept.js \
            popup.js; do
            node --check "$file"
          done

      - name: Run unit and contract tests
        run: node --test tests/*.test.js

      - name: Run read-only browser smoke test
        run: bash tests/browser/run-smoke.sh

      - name: Commit presentation cleanup
        shell: bash
        run: |
          if git diff --quiet -- content.js; then
            echo "No legacy presentation cleanup was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js
          git commit -m "refactor: move banner presentation out of content"
          git push origin HEAD:feat/dry-run-foundations
